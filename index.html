<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA客服运营报告库</title>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F0E8;font-family:'DM Sans',sans-serif;min-height:100vh;color:#2a2015}
.wrap{max-width:800px;margin:0 auto;padding:48px 40px 72px}
.header{border-top:3px solid #2a2015;border-bottom:1px solid #c8bfaa;padding:20px 0 16px;margin-bottom:40px}
.kicker{font-family:'Zilla Slab',serif;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#8a7a60;margin-bottom:6px}
.headline{font-family:'Zilla Slab',serif;font-size:28px;font-weight:600;color:#2a2015;line-height:1.1}
.sub{font-size:12px;color:#8a7a60;margin-top:6px}
.section-label{font-family:'Zilla Slab',serif;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8a7a60;padding-bottom:8px;border-bottom:2px solid #2a2015;margin-bottom:0}
.section{margin-bottom:36px}
.report-list{display:flex;flex-direction:column}
.report-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid #ddd4c0;text-decoration:none;color:inherit;transition:background .1s}
.report-item:hover{background:#EDE7D8;margin:0 -12px;padding-left:12px;padding-right:12px}
.report-item:last-child{border-bottom:none}
.report-type{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.type-daily{background:#EDE7D8;color:#5a4e3a;border:1px solid #c8bfaa}
.type-weekly{background:#1C1612;color:#F0EBE3}
.report-date{font-family:'Zilla Slab',serif;font-size:15px;font-weight:600;color:#2a2015}
.report-date-sub{font-size:11px;color:#8a7a60;margin-top:1px;font-family:'DM Mono',monospace}
.report-arrow{font-size:13px;color:#c8bfaa}
.report-item:hover .report-arrow{color:#2a2015}
.empty{color:#8a7a60;font-size:13px;padding:16px 0;font-style:italic}
.count-badge{font-family:'DM Mono',monospace;font-size:9px;color:#8a7a60;float:right;margin-top:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="kicker">富途证券 · 客户服务部</div>
    <div class="headline">CA客服运营报告库</div>
    <div class="sub">点击查看各期日报与周报</div>
  </div>

  <div class="section">
    <div class="section-label">日报 <span class="count-badge" id="daily-count"></span></div>
    <div class="report-list" id="daily-list"></div>
  </div>

  <div class="section">
    <div class="section-label">周报 <span class="count-badge" id="weekly-count"></span></div>
    <div class="report-list" id="weekly-list"></div>
  </div>
</div>

<script>
const DAILY = [
  { date: '2026-05-21', label: '5月21日（周四）' },
  { date: '2026-05-20', label: '5月20日（周三）' },
  { date: '2026-05-19', label: '5月19日（周二）' },
  { date: '2026-05-18', label: '5月18日（周一）' },
  { date: '2026-05-17', label: '5月17日（周日）' },
  { date: '2026-05-16', label: '5月16日（周六）' },
  { date: '2026-05-15', label: '5月15日（周五）' },
  { date: '2026-05-14', label: '5月14日（周四）' },
];

const WEEKLY = [
  { date: '2026-05-12', label: '5月6日–12日（第19周）' },
  { date: '2026-05-07', label: '5月7日（5月第一周）' },
  { date: '2026-05-06', label: '5月6日（5月第一周）' },
];

function renderList(items, type, listEl, countEl) {
  countEl.textContent = items.length + ' 份';
  if (!items.length) {
    listEl.innerHTML = '<div class="empty">暂无报告</div>';
    return;
  }
  const dir = type === 'daily' ? 'daily' : 'weekly';
  const prefix = type === 'daily' ? 'daily' : 'weekly';
  listEl.innerHTML = items.map(item => `
    <a class="report-item" href="${dir}/${prefix}-${item.date}.html">
      <span class="report-type type-${type}">${type === 'daily' ? '日报' : '周报'}</span>
      <div>
        <div class="report-date">${item.label}</div>
        <div class="report-date-sub">${prefix}-${item.date}.html</div>
      </div>
      <span class="report-arrow">›</span>
    </a>
  `).join('');
}

renderList(DAILY, 'daily',
  document.getElementById('daily-list'),
  document.getElementById('daily-count'));
renderList(WEEKLY, 'weekly',
  document.getElementById('weekly-list'),
  document.getElementById('weekly-count'));
</script>
</body>
</html>
