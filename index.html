<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Futu 客服报表</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.card { background: #fff; border-radius: 12px; padding: 40px 48px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 480px; width: 100%; }
h1 { font-size: 20px; color: #0f172a; margin-bottom: 8px; }
p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
.links a { display: block; padding: 12px 16px; margin-bottom: 10px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.15s; }
.links a:hover { opacity: 0.85; }
.daily  { background: #fff7ed; color: #c2410c; }
.weekly { background: #eff6ff; color: #1d4ed8; }
.monthly { background: #f0fdf4; color: #15803d; }
</style>
</head>
<body>
<div class="card">
  <h1>Futu 客服报表</h1>
  <p>选择报表类型查看历史记录</p>
  <div class="links">
    <a class="daily"   href="daily/">日报 →</a>
    <a class="weekly"  href="weekly/">周报 →</a>
    <a class="monthly" href="monthly/">月报 →</a>
  </div>
</div>
</body>
</html>
